apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardedbatches.batch.ericguerra.dev
spec:
  group: batch.ericguerra.dev
  scope: Namespaced
  names:
    kind: ShardedBatch
    plural: shardedbatches
    singular: shardedbatch
    shortNames: [sb]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.batch.phase }
        - { name: Progress, type: string, jsonPath: .status.batch.progress }
        - { name: Failed, type: integer, jsonPath: .status.batch.counts.failed }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, shards]
              properties:
                image: { type: string }
                command: { type: array, items: { type: string } }
                env:
                  type: object
                  additionalProperties: { type: string }
                shards:
                  description: Either a shard count or an explicit list of shard ids (store numbers, regions, partitions).
                  x-kubernetes-preserve-unknown-fields: true
                parallelism: { type: integer, minimum: 1, default: 5 }
                maxRetries: { type: integer, minimum: 0, default: 2 }
                backoffSeconds: { type: number, minimum: 0, default: 30 }
                failurePolicy: { type: string, enum: [Continue, FailFast], default: Continue }
                suspend: { type: boolean, default: false }
                activeDeadlineSeconds: { type: integer, minimum: 1, default: 3600 }
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
