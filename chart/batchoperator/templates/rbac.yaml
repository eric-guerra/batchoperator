apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "batchoperator.fullname" . }}
  labels: {{- include "batchoperator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "batchoperator.fullname" . }}
  labels: {{- include "batchoperator.labels" . | nindent 4 }}
rules:
  # our resource
  - apiGroups: [batch.ericguerra.dev]
    resources: [shardedbatches, shardedbatches/status]
    verbs: [get, list, watch, patch, update]
  # the Jobs we create (no pods/exec, no secrets)
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  # kopf framework: peering (leader election) and CRD discovery
  - apiGroups: [kopf.dev]
    resources: [clusterkopfpeerings, kopfpeerings]
    verbs: [get, list, watch, patch, create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "batchoperator.fullname" . }}
  labels: {{- include "batchoperator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "batchoperator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "batchoperator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: kopf.dev/v1
kind: ClusterKopfPeering
metadata:
  name: batchoperator
